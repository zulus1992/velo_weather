name: Прогноз для велосипеда в Telegram

on:
  schedule:
    # Cron указывается в UTC. Местное время, дни недели и режим прогноза заданы в
    # weather_schedule.json, здесь те же моменты (время по Минску = UTC+3, перехода
    # на летнее время в Беларуси нет). В cron воскресенье — 0 (или 7).
    # Сверить расписание с этим файлом:          python schedule_slots.py --check
    # Напечатать строки заново после правки JSON: python schedule_slots.py --cron-lines
    - cron: "0 12 * * *"  # 18:00 по Минску (без пятницы)   -> --day tomorrow: прогноз на завтра
  workflow_dispatch: # кнопка «Run workflow» — запуск вручную прямо с телефона
    inputs:
      day:
        description: "Период прогноза для ручного запуска (weather_schedule.json не используется)"
        type: choice
        default: tomorrow
        options:
          - tomorrow
          - today
          - weekend
          - all

concurrency:
  group: weather-telegram
  cancel-in-progress: false

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: "Диагностика: имя бота и доступные chat_id"
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python send_telegram.py --find-chat-id

      - name: Восстановить состояние доступов чатов (chat_auth.json)
        uses: actions/cache/restore@v4
        with:
          # Доступ чата открывается командой /password ПАРОЛЬ и запоминается в chat_auth.json;
          # кэш переносит это состояние между запусками, чтобы пароль не присылать каждый день.
          path: chat_auth.json
          key: telegram-chat-auth-${{ github.run_id }}
          restore-keys: telegram-chat-auth-

      - name: Определить слот расписания (weather_schedule.json)
        id: slot
        env:
          # При запуске по расписанию github.event.schedule содержит сработавший cron;
          # при ручном запуске он пуст, тогда используется выбранный period (inputs.day).
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_DAY: ${{ inputs.day }}
        run: |
          python schedule_slots.py \
            --cron "$SCHEDULE_CRON" \
            --github-output "$GITHUB_OUTPUT" \
            ${MANUAL_DAY:+--manual-day "$MANUAL_DAY"}

      - name: Отправить вердикт в Telegram
        # Если слот выключен в weather_schedule.json ("enabled": false), публикация пропускается
        if: steps.slot.outputs.skip != 'true'
        env:
          # Ключ OpenWeatherMap: хранится в секретах GitHub с именем WEATHER_API_KEY
          # (Settings -> Secrets and variables -> Actions -> WEATHER_API_KEY)
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Пароль доступа: пока в чат не отправят /password ПАРОЛЬ, бот ничего не публикует
          WEATHER_BOT_PASSWORD: ${{ secrets.WEATHER_BOT_PASSWORD }}
        # Аргументы приходят из weather_schedule.json: --day today | tomorrow | weekend | all
        # (--show-rules и --silent добавляются, если они указаны в слоте)
        run: python send_telegram.py ${{ steps.slot.outputs.args }}

      - name: Сохранить состояние доступов чатов (chat_auth.json)
        if: hashFiles('chat_auth.json') != ''
        uses: actions/cache/save@v4
        with:
          path: chat_auth.json
          key: telegram-chat-auth-${{ github.run_id }}
